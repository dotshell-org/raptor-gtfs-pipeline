# Lyon TCL — school-term / holiday profile.
# Combines day-of-week with a service_id regex to split weekdays into
# school-term vs school-holiday service (matches the app's 4 periods).
network: lyon-tcl
periods:
  saturday:
    days: [sat]
    description: Saturday service
  sunday:
    days: [sun]
    description: Sunday and holidays service
  school_on_weekdays:
    days: [mon-fri]
    service_id_matches: "-M-$"
    description: Weekdays during school term
  school_off_weekdays:
    days: [mon-fri]
    service_id_matches: "-[VW]-$"
    description: Weekdays during school holidays
unmatched: other
