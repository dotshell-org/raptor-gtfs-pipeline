network: lyon-tcl
options:
  flat_output: true
  write_index: false
periods:
  saturday:
    description: Saturday service
    days: [sat]
  sunday:
    description: Sunday service
    days: [sun]
  school_on_weekdays:
    description: Weekdays during school term
    rules:
      - days: [mon-fri]
        serviceIdMatches: "-M-$"
      - days: [mon-fri]
        activeInMonths: [9]
        notActiveInMonths: [8]
      - days: [mon-fri]
        activeInMonths: [8, 9]
        notActiveInMonths: [7]
      - days: [mon-fri]
        activeInMonths: [7, 8, 9]
      - days: [mon-fri]
        notActiveInMonths: [8, 9]
        minDurationMonths: 2
  school_off_weekdays:
    description: Weekdays during school holidays
    rules:
      - days: [mon-fri]
        serviceIdMatches: "-[VW]-$"
      - days: [mon-fri]
        activeInMonths: [8]
        notActiveInMonths: [9]
      - days: [mon-fri]
        activeInMonths: [7, 8, 9]
      - days: [mon-fri]
        notActiveInMonths: [8, 9]
        maxDurationMonths: 1
unmatched: warn
