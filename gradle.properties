# Maven coordinates of the published library: eu.dotshell:raptor-gtfs-pipeline:<version>.
# The version is declared here alone: :core generates PIPELINE_VERSION from it, so the
# tool_version written into every dataset.json can never drift from the artifact that
# produced it.
group=eu.dotshell
version=0.4.0

org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
